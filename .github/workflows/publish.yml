name: Publish image

# Builds a container image and publishes it, so nobody has to build anything by hand.
# The platform deploys the exact digest this prints — not a tag, which could later point
# somewhere else — which is what makes a deployment reproducible and a rollback easy.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the reference to give the platform
        # GHCR requires an all-lowercase image path, and docker/metadata-action already
        # normalizes it that way for the actual push above — but a GitHub repository name
        # can carry uppercase letters, so reconstructing the reference here from the raw
        # ${{ github.repository }} (as this used to) prints the wrong case whenever it
        # does. Lowercase it the same way metadata-action does, so the line printed here
        # always matches what was actually pushed.
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "Give this exact line to whoever onboards the app:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE_LOWER}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
